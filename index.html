<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google only shows a favicon beside a result if it is a square whose
         size is a multiple of 48px, which the 512px original is not. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favico.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>coyv — art, prints &amp; a print of the month</title>
    <meta
      name="description"
      content="coyv's castle: original artwork, limited prints, and a print-of-the-month subscription. Step past the threshold and wander the vault and the memories."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://coyvcastle.com/" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, Discord, WhatsApp, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="coyv" />
    <meta property="og:title" content="coyv — art, prints &amp; a print of the month" />
    <meta
      property="og:description"
      content="coyv's castle: original artwork, limited prints, and a print-of-the-month subscription. Step past the threshold and wander the vault and the memories."
    />
    <meta property="og:url" content="https://coyvcastle.com/" />
    <!-- Absolute: crawlers that do not resolve relative URLs (Google's image
         fetcher among them) drop a root-relative og:image entirely. -->
    <meta property="og:image" content="https://coyvcastle.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://coyvcastle.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A pale, pencil-and-wash drawing of a girl with sea-green hair among sketched pages"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="coyv — art, prints &amp; a print of the month" />
    <meta
      name="twitter:description"
      content="coyv's castle: original artwork, limited prints, and a print-of-the-month subscription. Step past the threshold and wander the vault and the memories."
    />
    <meta name="twitter:image" content="https://coyvcastle.com/og-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="A pale, pencil-and-wash drawing of a girl with sea-green hair among sketched pages"
    />

    <!-- Structured data. Google reads this from the served HTML to decide the
         site name and the favicon it shows beside a result; without it the
         listing falls back to the bare domain. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://coyvcastle.com/#website",
            "url": "https://coyvcastle.com/",
            "name": "coyv",
            "alternateName": "coyv castle",
            "description": "Original artwork, limited prints, and a print-of-the-month subscription by coyv.",
            "inLanguage": "en",
            "publisher": { "@id": "https://coyvcastle.com/#person" },
            "image": "https://coyvcastle.com/og-image.jpg"
          },
          {
            "@type": "Person",
            "@id": "https://coyvcastle.com/#person",
            "name": "coyv",
            "url": "https://coyvcastle.com/",
            "jobTitle": "Artist",
            "image": "https://coyvcastle.com/favico.png"
          }
        ]
      }
    </script>

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y9F2DXZFDY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      // Local development would otherwise land in the production property.
      // gtag still queues every call onto dataLayer, so the events remain
      // inspectable while developing; this only stops them being sent.
      window['ga-disable-G-Y9F2DXZFDY'] =
        location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      gtag('js', new Date());
      // send_page_view is off because this is a single-page app: gtag would
      // only ever count the first document load. useRouteAnalytics sends a
      // page_view for every route instead, including the first.
      gtag('config', 'G-Y9F2DXZFDY', { send_page_view: false });
    </script>
    <!-- End Google Analytics -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
