services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-coyv}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-coyv}
    volumes:
      - mongo-data:/data/db
    # Not published to the host: only the API needs to reach it.
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-coyv}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-coyv}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY in .env}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET in .env}
      CURRENCY: ${CURRENCY:-usd}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_SIGNED_URL_TTL_SECONDS: ${S3_SIGNED_URL_TTL_SECONDS:-3600}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-15728640}
    expose:
      - "4000"

  web:
    build:
      context: .
      args:
        # Vite inlines these at build time, so changing one means rebuilding
        # the image, not just restarting the container.
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:?set VITE_STRIPE_PUBLISHABLE_KEY in .env}
        VITE_ADMIN_PATH: ${VITE_ADMIN_PATH:-/studio-back-door}
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mongo-data:
