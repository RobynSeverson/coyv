server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads go through the API, so the body limit has to clear the largest
  # image the admin panel will accept.
  client_max_body_size 20m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Same-origin API, which is what lets the admin session cookie stay
  # SameSite=Strict.
  location /api/ {
    # Docker's embedded DNS. Resolving through a variable means nginx starts
    # even when the api container is not up yet, and picks up its new address
    # if it is recreated — a literal upstream is resolved once, at boot, and
    # aborts startup when it fails.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream api;

    proxy_pass http://$api_upstream:4000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Vite emits content-hashed filenames, so these can never go stale.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routing: anything that is not a real file is the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
